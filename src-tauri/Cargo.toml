[package]
name = "tagma-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tagma-core = { path = "../crates/tagma-core" }
tagma-runtime = { path = "../crates/tagma-runtime" }
tokio = { version = "1.53", features = ["time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1.0"
uuid = { version = "1.28", features = ["v4"] }
zeroize = "1.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
fs2 = "0.4"
