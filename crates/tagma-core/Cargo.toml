[package]
name = "tagma-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.23", features = ["v4"] }
url = "2.5"
fs2 = "0.4"
ts-rs = "12.0.1"
zeroize = "1.8"
keyring = "3.6.3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
