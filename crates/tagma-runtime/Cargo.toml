[package]
name = "tagma-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tagma-core = { path = "../tagma-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "process"] }
interprocess = { version = "2.4.0", features = ["tokio"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
sha2 = "0.10"
fs2 = "0.4"
zeroize = "1.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
tempfile = "3.27"
tokio-util = {version="0.7",features=["rt"]}

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
