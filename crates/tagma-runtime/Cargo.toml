[package]
name = "tagma-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tagma-core = { path = "../tagma-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "process"] }
interprocess = { version = "2.4.0", features = ["tokio"] }
uuid = { version = "1.28", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27"
