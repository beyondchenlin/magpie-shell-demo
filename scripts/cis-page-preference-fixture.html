<!doctype html><meta charset="utf-8"><title>CIS pages preference restore</title>
<h1>CIS isolated page preferences</h1>
<p>Explicit task-origin keys only; restore before closing this tab.</p>
<button id="snapshot">Snapshot initial preferences</button>
<button id="restore">Restore initial preferences</button>
<a href="/">Open preview</a><pre id="state"></pre>
<script>
const keys=['magpie.navLayout','magpie.lang','magpie.uiLocale','magpie.demoPrefs','magpie.demoGw','magpie.routingPeerServes','magpie.flavor','magpie.snipLang','magpie.gwSnipLang','magpie.snipOS','magpie.gwConnectFolded','magpie.gwModelsFolded','magpie.model','magpie.agentOrder','magpie.demoAgentWired','magpie.demoProviders','magpie.demoProviderOrder','magpie.usageTab','magpie.usagePeriod','magpie.sessRange','magpie.usageEvery','magpie.ctxDays','magpie.pluginTab','magpie.sort.plugins','magpie.feature.library','magpie.feature.groups','magpie.bunReady','magpie.modelFavorites','magpie-demo-guideHidden','magpie.demoAmModels','magpie.demoAmPrefs','magpie.libTab','magpie.maskEmails','magpie.routingMetrics','magpie.noAutoGroups','magpie.plainNames','magpie.plainOwnNames','magpie.routingBySession','magpie.ledHeatMetric'];
const backupKey='cis-pages-20261016-initial-v1';
const read=()=>Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));
const show=action=>document.querySelector('#state').textContent=JSON.stringify({action,current:read(),initial:JSON.parse(sessionStorage.getItem(backupKey)||'null')},null,2);
document.querySelector('#snapshot').onclick=()=>{if(!sessionStorage.getItem(backupKey))sessionStorage.setItem(backupKey,JSON.stringify(read()));show('Initial snapshot retained');};
document.querySelector('#restore').onclick=()=>{const initial=JSON.parse(sessionStorage.getItem(backupKey)||'null');if(!initial){show('No snapshot; nothing changed');return;}for(const key of keys){if(!Object.hasOwn(initial,key))continue;if(initial[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,initial[key]);}show('Restored listed preferences');};
show('Read only; snapshot before testing');
</script>
