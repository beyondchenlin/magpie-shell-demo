[workspace]
members = ["crates/tagma-core", "crates/tagma-runtime", "crates/tagma-gateway", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
